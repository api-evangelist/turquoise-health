note: >-
  Re-probed the /.well-known/ discovery surface across all three Turquoise Health hosts.
  The marketing/docs host (turquoise.health) 404s every path. The REST API host
  (api.turquoise.health) answers every path with HTTP 401 behind its bearer-token gate,
  including /.well-known/*, so nothing is anonymously readable there. The MCP host
  (consumer-mcp.turquoise.health) DOES serve two real, anonymous documents: RFC 8414
  OAuth authorization-server metadata and RFC 9728 OAuth protected-resource metadata.
  Those two 200s are the basis for the WellKnown pointer; no security.txt is served on
  any host, so no SecurityTxt pointer is emitted.
