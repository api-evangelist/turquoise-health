          - type: string
          - type: 'null'
          description: Opaque cursor from a previous page.next_cursor.
          title: Cursor
        description: Opaque cursor from a previous page.next_cursor.
      - name: location.near.lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          examples:
          - 39.745961
          title: Location.Near.Lat
      - name: location.near.lng
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          examples:
          - -104.971559
          title: Location.Near.Lng
      - name: location.near.radius_m
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          examples:
          - 25000
          title: Location.Near.Radius M
      - name: location.within.state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
          - type: 'null'
          examples:
          - CO
          title: Location.Within.State
      - name: location.within.cbsa
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Denver-Aurora-Centennial, CO
          title: Location.Within.Cbsa
      - name: location.within.zip_codes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated ZIP codes (exact match, any-of).
          examples:
          - 80218,80210
          title: Location.Within.Zip Codes
        description: Comma-separated ZIP codes (exact match, any-of).
      - name: location.zip
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Resolves the ZIP to its centroid, then runs `near` with the default radius.
          examples:
          - '80218'
          title: Location.Zip
        description: Resolves the ZIP to its centroid, then runs `near` with the default radius.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope_Network_'
        '400':
          description: Bad request
