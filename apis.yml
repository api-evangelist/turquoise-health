- name: Standard Service Packages (SSP)
  description: Turquoise's open library of Standard Service Packages, which gather all medical services,
    materials and fees associated with a healthcare procedure and represent them as a single
    standardized code. SSPs are the addressing scheme for the entire Consumer Pricing API and are served
    through its package operations — GET /v3/packages, GET /v3/packages/{package_id} and GET
    /v3/packages/{package_id}/line_items, where line items carry a fee type and a probabilistic
    association rate. Turquoise publishes no separate standalone SSP API host.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://turquoise.health/products/ssps
