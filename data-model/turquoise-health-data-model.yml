- from: Package
  to: BillingCode
  type: has_many
  via: anchor_codes
  note: The package's comprehensive anchor (base) billing codes.
- from: Package
  to: LineItem
  type: has_many
  via: /v3/packages/{package_id}/line_items
- from: Provider
  to: ProviderAddress
  type: has_one
  via: address
- from: Provider
  to: Package
  type: many_to_many
  via: ProviderPackagePrice
  note: The join carries the price; this is the fact table.
- from: PersonalizedEstimate
  to: ProviderPackagePrice
  type: derives_from
  via: package_id + pricing.network_id + provider_id
- from: Network
  to: PersonalizedEstimate
  type: has_many
