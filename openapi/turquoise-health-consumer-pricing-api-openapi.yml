        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Semantic search over network and payer names. Composes with the other filters; returns a single relevance-ordered page (no cursor).
          examples:
          - Cigna
          title: Search
        description: Semantic search over network and payer names. Composes with the other filters; returns a single relevance-ordered page (no cursor).
      - name: min_score
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          description: Minimum similarity score (0-1).
          title: Min Score
        description: Minimum similarity score (0-1).
      - name: page_size
        in: query
        required: false
