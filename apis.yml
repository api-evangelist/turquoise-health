- name: Turquoise Connector (MCP)
  description: Hosted Model Context Protocol server exposing Turquoise's consumer pricing to AI agents
    over streamable HTTP. Five workflow-shaped tools — find_entity, compare_prices,
    provider_cost_detail, explain_pricing and estimate_out_of_pocket — each resolving plain-language
    names and composing several Consumer Pricing v3 REST calls server-side. Authenticated with the same
    OAuth 2.0 client-credentials token as the REST API, carrying the read:mcp scope; interactive clients
    such as Claude Code, Claude Desktop, Codex and Cursor can instead sign in through the browser.
    Currently in Public Preview.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://turquoise.health/api/docs/mcp-reference/
