aid: turquoise-health
name: Turquoise Health
description: Turquoise Health is a healthcare price transparency platform. Its public developer surface
  is the Consumer Pricing API — a documented OpenAPI 3.1.0 REST API at api.turquoise.health covering
  providers, payers, networks, Standard Service Packages, and cash and insurer-negotiated rates for
  shoppable services, plus personalized out-of-pocket estimates computed by layering a member's live
  X12 270/271 eligibility and accumulators onto a negotiated rate. The same OAuth 2.0 client-credentials
  token also authenticates a hosted Model Context Protocol server at consumer-mcp.turquoise.health,
  which exposes five workflow-shaped pricing tools to AI agents. Turquoise also sells platform tiers for
  market intelligence, contract intelligence and precision contracting to providers, payers and life
  sciences organizations, generates CMS-compliant machine-readable files, and publishes free public
  tools including the Medicare Pricer, payer transparency scores and a hospital transparency tracker.
