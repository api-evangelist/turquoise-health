      operationId: v3_list_networks
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on network or payer name.
          examples:
          - Cigna
          - National OAP
          title: Name
        description: Case-insensitive substring match on network or payer name.
      - name: payer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact payer id match.
          examples:
          - '76'
          title: Payer Id
        description: Exact payer id match.
      - name: provider_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Networks with at least one price at this provider.
          examples:
          - '5756'
          title: Provider Id
        description: Networks with at least one price at this provider.
      - name: package_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Networks with at least one price for this package.
          examples:
          - OB002
          title: Package Id
        description: Networks with at least one price for this package.
      - name: search
