- id: x12-270-271-eligibility
  conforms: true
  evidence: >-
    Personalized estimates are produced by running a real-time X12 270/271 eligibility
    transaction with the member's payer. Turquoise documents translating X12 Service Type
    Categories (e.g. STC 05 "Labs") into CPT/HCPCS-level benefit adjudication logic.
    Source: https://turquoise.health/api/docs/personalized-estimates.md

