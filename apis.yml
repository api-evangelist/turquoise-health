apis:
- name: Turquoise Consumer Pricing API
  description: REST API providing consumer-friendly healthcare price estimates — cash and
    insurer-negotiated rates — for shoppable services, addressed by Standard Service Package rather than
    raw billing code so every provider is priced on the same definition of a service. Fifteen operations
    across providers, payers, networks, packages, prices and personalized estimates. The
    personalized-estimates endpoints run a consented X12 270/271 eligibility check and return a member's
    actual cost share broken into deductible, copayment and coinsurance, alongside their current
    accumulator state. OpenAPI 3.1.0 published publicly and unauthenticated; all endpoints require an
    OAuth 2.0 client-credentials bearer token.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://turquoise.health/api/docs/
  baseURL: https://api.turquoise.health
  tags:
