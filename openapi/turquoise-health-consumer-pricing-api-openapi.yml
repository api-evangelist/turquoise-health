openapi: 3.2.0
info:
  title: Turquoise Health API v3 Consumer Pricing API
  version: 0.1.0
servers:
- url: https://api.turquoise.health
tags:
- name: Consumer Pricing
paths:
  /v3/providers/types:
    get:
      tags:
      - Consumer Pricing
      summary: Get Provider Types
      description: Fetch provider types. Results return valid inputs to filter by provider types across the API.
      operationId: v3_get_provider_types
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response V3 Get Provider Types
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /v3/providers:
    get:
      tags:
      - Consumer Pricing
      summary: List Providers
      description: Retrieve a list of providers, filtered over a search by name, NPI, provider type, or location. Additionally, filter to a list of providers with Turquoise price estimates available by a selected payer, network, or package. Results reflect provider, payer, and package combinations that Turquoise has priced services for; the list may not be comprehensive of all contacted payer networks or services that are available.
      operationId: v3_list_providers
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive substring match on provider name.
          examples:
          - Intermountain Health Saint Joseph Hospital
          title: Name
        description: Case-insensitive substring match on provider name.
      - name: npi
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact NPI match.
          examples:
          - '1417946021'
          title: Npi
        description: Exact NPI match.
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Provider type as reported in the dataset (exact match).
          examples:
          - Short Term Acute Care Hospital
          title: Type
        description: Provider type as reported in the dataset (exact match).
      - name: package_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Providers with at least one price for this package.
          examples:
          - OB002
          title: Package Id
        description: Providers with at least one price for this package.
      - name: network_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Providers with at least one price under this network (combined with package_id/payer_id, the same price row must match).
          examples:
          - '-3776001016975145508'
          title: Network Id
        description: Providers with at least one price under this network (combined with package_id/payer_id, the same price row must match).
      - name: payer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Providers priced under any of this payer's networks (combined with other relationship filters, the same price row must match).
          examples:
          - '76'
          title: Payer Id
        description: Providers priced under any of this payer's networks (combined with other relationship filters, the same price row must match).
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Semantic search over provider names. Composes with the other filters and a near/zip location; returns a single relevance-ordered page. 503 search_unavailable until the provider embedding index is populated.
          examples:
          - Saint Joseph hospital in Denver
          title: Search
        description: Semantic search over provider names. Composes with the other filters and a near/zip location; returns a single relevance-ordered page. 503 search_unavailable until the provider embedding index is populated.
      - name: min_score
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          description: Minimum similarity score (0-1).
          title: Min Score
        description: Minimum similarity score (0-1).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 250
          minimum: 1
          default: 25
          title: Page Size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor from a previous page.next_cursor.
          title: Cursor
        description: Opaque cursor from a previous page.next_cursor.
      - name: location.near.lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          examples:
          - 39.745961
          title: Location.Near.Lat
      - name: location.near.lng
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          examples:
          - -104.971559
          title: Location.Near.Lng
      - name: location.near.radius_m
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          examples:
          - 25000
          title: Location.Near.Radius M
      - name: location.within.state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
          - type: 'null'
          examples:
          - CO
          title: Location.Within.State
      - name: location.within.cbsa
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Denver-Aurora-Centennial, CO
          title: Location.Within.Cbsa
      - name: location.within.zip_codes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated ZIP codes (exact match, any-of).
          examples:
          - 80218,80210
          title: Location.Within.Zip Codes
        description: Comma-separated ZIP codes (exact match, any-of).
      - name: location.zip
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Resolves the ZIP to its centroid, then runs `near` with the default radius.
          examples:
          - '80218'
          title: Location.Zip
        description: Resolves the ZIP to its centroid, then runs `near` with the default radius.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope_Provider_'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /v3/providers/{provider_id}:
    get:
      tags:
      - Consumer Pricing
      summary: Get Provider Details
      description: Fetch details for a single provider by provider ID.
      operationId: v3_get_provider
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          description: Provider identifier.
          examples:
          - '5756'
          title: Provider Id
        description: Provider identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
